<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+BR+Guides&display=swap" rel="stylesheet">
</head>
<body>
    <!-- <header> é uma tag semântica: ela existe
    especificamente para marca o cabeçalho do site.
    class="header" conecta essa tag com o CSS -->
    <header class="header">
    <!-- Essa div e so um "envelope" interno,
      usado para limitar a largura do contêudo
      e organizar os itens com Flexbox-->

        <div class="header-inner">
            <a href="#" class="logo">
            
              <img src="./assets/image (1).png" alt="logo do Eduplan">
              <h2 style="color: #198227">Edu <span 
               style="color: #1d1dc0">plan</span></h2>
            </a>
            <ul class="nav" id="nav">
                <li><a href="#">Início</a></li>
                <li><a href="#">Recursos</a></li>
                <li><a href="#">Benefícios</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Depoimento</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
            <div class="actions">
                <a href="#" class="btn-entrar">Entrar</a>
                <a href="#" class="btn-cadastrar">Cadastrar</a>
            </div>
            <div class="header-background"></div>
        </div>
    </header>
</body>
</html>
